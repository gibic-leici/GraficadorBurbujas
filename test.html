<button id="conectar">Conectar</button>
<button id="enviar">Enviar</button>
<pre id="log"></pre>

<script>
let port, writer;

document.getElementById('conectar').onclick = async () => {
  port = await navigator.serial.requestPort(); // opcional: {filters:[{usbVendorId:0x0483}]}
  await port.open({ baudRate: 115200 });

  writer = port.writable.getWriter();

  // Lectura continua
  const decoder = new TextDecoder();
  const reader = port.readable.getReader();
  (async () => {
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      document.getElementById('log').textContent += decoder.decode(value);
    }
  })();
};

document.getElementById('enviar').onclick = async () => {
  await writer.write(new TextEncoder().encode("hola\r\n"));
};
</script>
